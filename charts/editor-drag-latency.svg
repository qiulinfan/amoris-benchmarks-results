<svg xmlns="http://www.w3.org/2000/svg" width="800" height="242" viewBox="0 0 800 242" role="img" aria-labelledby="title desc">
<title id="title">Editor: dragging an object on the live host</title>
<desc id="desc">From a pointer move to the frame that shows it, median ms (lower is better)</desc>
<style>
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#77756f}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.link{stroke:#c3c2b7}
.amoris{fill:#2a78d6}.other{fill:#eb6834}.muted{fill:#a3a19a}
.ring{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#9a988f}
.grid{stroke:#2c2c2a}.base{stroke:#4a4a46}.link{stroke:#4a4a46}
.amoris{fill:#3987e5}.other{fill:#d95926}.muted{fill:#6e6d68}
.ring{stroke:#1a1a19}
}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
</style>
<rect x="0.5" y="0.5" width="799" height="241" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">Editor: dragging an object on the live host</text>
<text x="24.0" y="56.0" class="t2" font-size="12.5" text-anchor="start">From a pointer move to the frame that shows it, median ms (lower is better)</text>
<line x1="274.0" y1="76.0" x2="274.0" y2="164.0" class="grid" stroke-width="1"/>
<text x="274.0" y="179.0" class="t3" font-size="11" text-anchor="middle">0</text>
<line x1="381.5" y1="76.0" x2="381.5" y2="164.0" class="grid" stroke-width="1"/>
<text x="381.5" y="179.0" class="t3" font-size="11" text-anchor="middle">20</text>
<line x1="489.0" y1="76.0" x2="489.0" y2="164.0" class="grid" stroke-width="1"/>
<text x="489.0" y="179.0" class="t3" font-size="11" text-anchor="middle">40</text>
<line x1="596.5" y1="76.0" x2="596.5" y2="164.0" class="grid" stroke-width="1"/>
<text x="596.5" y="179.0" class="t3" font-size="11" text-anchor="middle">60</text>
<line x1="704.0" y1="76.0" x2="704.0" y2="164.0" class="grid" stroke-width="1"/>
<text x="704.0" y="179.0" class="t3" font-size="11" text-anchor="middle">80</text>
<text x="24.0" y="93.5" class="t1" font-size="13" text-anchor="start">Before</text>
<path d="M274.0,82.0 H595.2 A4,4 0 0 1 599.2,86.0 V92.0 A4,4 0 0 1 595.2,96.0 H274.0 Z" class="muted"/>
<text x="605.2" y="93.5" class="t1" font-size="12" text-anchor="start">60.5 ms (p95 92.4)</text>
<text x="24.0" y="123.5" class="t1" font-size="13" text-anchor="start">Host sends a frame on each update</text>
<path d="M274.0,112.0 H528.0 A4,4 0 0 1 532.0,116.0 V122.0 A4,4 0 0 1 528.0,126.0 H274.0 Z" class="muted"/>
<text x="538.0" y="123.5" class="t1" font-size="12" text-anchor="start">48.0 ms (p95 75.8)</text>
<text x="24.0" y="153.5" class="t1" font-size="13" text-anchor="start">Editor also sends each move at once</text>
<path d="M274.0,142.0 H348.5 A4,4 0 0 1 352.5,146.0 V152.0 A4,4 0 0 1 348.5,156.0 H274.0 Z" class="amoris"/>
<text x="358.5" y="153.5" class="t1" font-size="12" text-anchor="start">14.6 ms (p95 26.1)</text>
<line x1="274.0" y1="76.0" x2="274.0" y2="164.0" class="base" stroke-width="1"/>
<text x="24.0" y="207.0" class="t3" font-size="11.5" text-anchor="start">Windows laptop · Chrome 155 headless, WebGPU on the Radeon 780M · editor production build</text>
<text x="24.0" y="224.0" class="t3" font-size="11.5" text-anchor="start">on the real host · 2026-10-16, quiet machine, median of five runs of a 1.5 s drag.</text>
</svg>
