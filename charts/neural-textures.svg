<svg xmlns="http://www.w3.org/2000/svg" width="800" height="334" viewBox="0 0 800 334" role="img" aria-labelledby="title desc">
<title id="title">Neural texture compression: storage</title>
<desc id="desc">Bits per mip-0 texel, all mips included, for a 9-channel 1024x1024 PBR material (lower is smaller)</desc>
<style>
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#77756f}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.link{stroke:#c3c2b7}
.amoris{fill:#2a78d6}.other{fill:#eb6834}.muted{fill:#a3a19a}
.ring{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#9a988f}
.grid{stroke:#2c2c2a}.base{stroke:#4a4a46}.link{stroke:#4a4a46}
.amoris{fill:#3987e5}.other{fill:#d95926}.muted{fill:#6e6d68}
.ring{stroke:#1a1a19}
}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
</style>
<rect x="0.5" y="0.5" width="799" height="333" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">Neural texture compression: storage</text>
<text x="24.0" y="56.0" class="t2" font-size="12.5" text-anchor="start">Bits per mip-0 texel, all mips included, for a 9-channel 1024x1024 PBR material (lower is smaller)</text>
<line x1="234.0" y1="76.0" x2="234.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="234.0" y="271.0" class="t3" font-size="11" text-anchor="middle">0</text>
<line x1="328.0" y1="76.0" x2="328.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="328.0" y="271.0" class="t3" font-size="11" text-anchor="middle">25</text>
<line x1="422.0" y1="76.0" x2="422.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="422.0" y="271.0" class="t3" font-size="11" text-anchor="middle">50</text>
<line x1="516.0" y1="76.0" x2="516.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="516.0" y="271.0" class="t3" font-size="11" text-anchor="middle">75</text>
<line x1="610.0" y1="76.0" x2="610.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="610.0" y="271.0" class="t3" font-size="11" text-anchor="middle">100</text>
<line x1="704.0" y1="76.0" x2="704.0" y2="256.0" class="grid" stroke-width="1"/>
<text x="704.0" y="271.0" class="t3" font-size="11" text-anchor="middle">125</text>
<text x="24.0" y="93.5" class="t1" font-size="13" text-anchor="start">8-bit, GPU formats</text>
<path d="M234.0,82.0 H671.0 A4,4 0 0 1 675.0,86.0 V92.0 A4,4 0 0 1 671.0,96.0 H234.0 Z" class="muted"/>
<text x="681.0" y="93.5" class="t1" font-size="12" text-anchor="start">117.3</text>
<text x="24.0" y="123.5" class="t1" font-size="13" text-anchor="start">8-bit, tightly packed</text>
<path d="M234.0,112.0 H591.0 A4,4 0 0 1 595.0,116.0 V122.0 A4,4 0 0 1 591.0,126.0 H234.0 Z" class="muted"/>
<text x="601.0" y="123.5" class="t1" font-size="12" text-anchor="start">96.0</text>
<text x="24.0" y="155.0" class="t1" font-size="13" text-anchor="start">Block compression, high</text>
<text x="24.0" y="170.0" class="t3" font-size="11.5" text-anchor="start">BC7, BC5, BC4</text>
<path d="M234.0,150.0 H370.4 A4,4 0 0 1 374.4,154.0 V160.0 A4,4 0 0 1 370.4,164.0 H234.0 Z" class="muted"/>
<text x="380.4" y="161.5" class="t1" font-size="12" text-anchor="start">37.33</text>
<text x="24.0" y="201.0" class="t1" font-size="13" text-anchor="start">Block compression, low</text>
<text x="24.0" y="216.0" class="t3" font-size="11.5" text-anchor="start">BC1, BC5, BC4</text>
<path d="M234.0,196.0 H330.3 A4,4 0 0 1 334.3,200.0 V206.0 A4,4 0 0 1 330.3,210.0 H234.0 Z" class="muted"/>
<text x="340.3" y="207.5" class="t1" font-size="12" text-anchor="start">26.67</text>
<text x="24.0" y="245.5" class="t1" font-size="13" text-anchor="start">Neural (.ntex)</text>
<path d="M234.0,234.0 H250.2 A4,4 0 0 1 254.2,238.0 V244.0 A4,4 0 0 1 250.2,248.0 H234.0 Z" class="amoris"/>
<text x="260.2" y="245.5" class="t1" font-size="12" text-anchor="start">5.37</text>
<line x1="234.0" y1="76.0" x2="234.0" y2="256.0" class="base" stroke-width="1"/>
<text x="24.0" y="299.0" class="t3" font-size="11.5" text-anchor="start">Sizes are exact for each format and do not depend on the GPU (neural: network and latents).</text>
<text x="24.0" y="316.0" class="t3" font-size="11.5" text-anchor="start">Quality depends on the content; see the table below the chart.</text>
</svg>
