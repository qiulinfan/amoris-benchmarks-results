<svg xmlns="http://www.w3.org/2000/svg" width="800" height="404" viewBox="0 0 800 404" role="img" aria-labelledby="title desc">
<title id="title">Shadow cascades culled by the camera slice they shade</title>
<desc id="desc">GPU time of the four shadow cascades in ms (lower is better)</desc>
