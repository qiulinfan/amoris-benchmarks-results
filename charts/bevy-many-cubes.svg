<svg xmlns="http://www.w3.org/2000/svg" width="800" height="266" viewBox="0 0 800 266" role="img" aria-labelledby="title desc">
<title id="title">1.6 million cubes: Amoris and Bevy 0.19, same machine</title>
<desc id="desc">many_cubes benchmark, frame time in ms (lower is better)</desc>
<style>
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#77756f}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.link{stroke:#c3c2b7}
.amoris{fill:#2a78d6}.other{fill:#eb6834}.muted{fill:#a3a19a}
.ring{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#9a988f}
.grid{stroke:#2c2c2a}.base{stroke:#4a4a46}.link{stroke:#4a4a46}
.amoris{fill:#3987e5}.other{fill:#d95926}.muted{fill:#6e6d68}
.ring{stroke:#1a1a19}
}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
</style>
<rect x="0.5" y="0.5" width="799" height="265" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">1.6 million cubes: Amoris and Bevy 0.19, same machine</text>
<text x="24.0" y="56.0" class="t2" font-size="12.5" text-anchor="start">many_cubes benchmark, frame time in ms (lower is better)</text>
<rect x="24.0" y="77.0" width="10" height="10" rx="2" class="other"/>
<text x="39.0" y="86.0" class="t2" font-size="12" text-anchor="start">Bevy 0.19</text>
<rect x="120.4" y="77.0" width="10" height="10" rx="2" class="amoris"/>
<text x="135.4" y="86.0" class="t2" font-size="12" text-anchor="start">Amoris</text>
<line x1="234.0" y1="98.0" x2="234.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="234.0" y="203.0" class="t3" font-size="11" text-anchor="middle">0</text>
<line x1="390.7" y1="98.0" x2="390.7" y2="188.0" class="grid" stroke-width="1"/>
<text x="390.7" y="203.0" class="t3" font-size="11" text-anchor="middle">5</text>
<line x1="547.3" y1="98.0" x2="547.3" y2="188.0" class="grid" stroke-width="1"/>
<text x="547.3" y="203.0" class="t3" font-size="11" text-anchor="middle">10</text>
<line x1="704.0" y1="98.0" x2="704.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="704.0" y="203.0" class="t3" font-size="11" text-anchor="middle">15</text>
<text x="24.0" y="117.0" class="t1" font-size="13" text-anchor="start">Sphere layout</text>
<text x="24.0" y="132.0" class="t3" font-size="11.5" text-anchor="start">cubes around the camera</text>
<path d="M234.0,104.0 H555.9 A4,4 0 0 1 559.9,108.0 V114.0 A4,4 0 0 1 555.9,118.0 H234.0 Z" class="other"/>
<text x="565.9" y="115.5" class="t1" font-size="12" text-anchor="start">10.3–10.5 ms</text>
<path d="M234.0,120.0 H491.6 A4,4 0 0 1 495.6,124.0 V130.0 A4,4 0 0 1 491.6,134.0 H234.0 Z" class="amoris"/>
<text x="501.6" y="131.5" class="t1" font-size="12" text-anchor="start">8.35 ms (display's 120 Hz cap)</text>
<text x="24.0" y="163.0" class="t1" font-size="13" text-anchor="start">Dense layout</text>
<text x="24.0" y="178.0" class="t3" font-size="11.5" text-anchor="start">camera inside a solid grid</text>
<path d="M234.0,150.0 H637.3 A4,4 0 0 1 641.3,154.0 V160.0 A4,4 0 0 1 637.3,164.0 H234.0 Z" class="other"/>
<text x="647.3" y="161.5" class="t1" font-size="12" text-anchor="start">13.0–13.1 ms</text>
<path d="M234.0,166.0 H596.6 A4,4 0 0 1 600.6,170.0 V176.0 A4,4 0 0 1 596.6,180.0 H234.0 Z" class="amoris"/>
<text x="606.6" y="177.5" class="t1" font-size="12" text-anchor="start">11.7 ms</text>
<line x1="234.0" y1="98.0" x2="234.0" y2="188.0" class="base" stroke-width="1"/>
<text x="24.0" y="231.0" class="t3" font-size="11.5" text-anchor="start">Apple M5 · Metal · 2026-10-04 · one mesh, one material, 1,600,000 cubes, release builds.</text>
<text x="24.0" y="248.0" class="t3" font-size="11.5" text-anchor="start">macOS holds a windowed app at the display rate, so Amoris's sphere frame is the 120 Hz cap.</text>
</svg>
