<svg xmlns="http://www.w3.org/2000/svg" width="800" height="346" viewBox="0 0 800 346" role="img" aria-labelledby="title desc">
<title id="title">Physics: Rapier (Amoris's engine) against Jolt 5.6</title>
<desc id="desc">Rapier's step time divided by Jolt's: deterministic builds, one thread, paired median</desc>
<style>
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#77756f}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.link{stroke:#c3c2b7}
.amoris{fill:#2a78d6}.other{fill:#eb6834}.muted{fill:#a3a19a}
.ring{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#9a988f}
.grid{stroke:#2c2c2a}.base{stroke:#4a4a46}.link{stroke:#4a4a46}
.amoris{fill:#3987e5}.other{fill:#d95926}.muted{fill:#6e6d68}
.ring{stroke:#1a1a19}
}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
</style>
<rect x="0.5" y="0.5" width="799" height="345" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">Physics: Rapier (Amoris's engine) against Jolt 5.6</text>
<text x="24.0" y="56.0" class="t2" font-size="12.5" text-anchor="start">Rapier's step time divided by Jolt's: deterministic builds, one thread, paired median</text>
<text x="517.0" y="94.0" class="t2" font-size="12" text-anchor="end" font-weight="600">← Rapier faster</text>
<text x="537.0" y="94.0" class="t2" font-size="12" text-anchor="start" font-weight="600">Jolt faster →</text>
<line x1="294.0" y1="106.0" x2="294.0" y2="268.0" class="grid" stroke-width="1"/>
<text x="294.0" y="283.0" class="t3" font-size="11" text-anchor="middle">0.25×</text>
<line x1="410.5" y1="106.0" x2="410.5" y2="268.0" class="grid" stroke-width="1"/>
<text x="410.5" y="283.0" class="t3" font-size="11" text-anchor="middle">0.5×</text>
<line x1="527.0" y1="106.0" x2="527.0" y2="268.0" class="grid" stroke-width="1"/>
<text x="527.0" y="283.0" class="t3" font-size="11" text-anchor="middle">1×</text>
<line x1="643.5" y1="106.0" x2="643.5" y2="268.0" class="grid" stroke-width="1"/>
<text x="643.5" y="283.0" class="t3" font-size="11" text-anchor="middle">2×</text>
<line x1="760.0" y1="106.0" x2="760.0" y2="268.0" class="grid" stroke-width="1"/>
<text x="760.0" y="283.0" class="t3" font-size="11" text-anchor="middle">4×</text>
<text x="24.0" y="116.0" class="t1" font-size="13" text-anchor="start">Box pyramid</text>
<text x="24.0" y="130.0" class="t3" font-size="11" text-anchor="start">1,240 boxes</text>
<path d="M527.0,110.0 H463.7 A4,4 0 0 0 459.7,114.0 V120.0 A4,4 0 0 0 463.7,124.0 H527.0 Z" class="amoris"/>
<text x="453.7" y="121.5" class="t1" font-size="12" text-anchor="end">0.67×</text>
<text x="24.0" y="150.0" class="t1" font-size="13" text-anchor="start">Large box pyramid</text>
<text x="24.0" y="164.0" class="t3" font-size="11" text-anchor="start">9,455 boxes</text>
<path d="M527.0,144.0 H385.2 A4,4 0 0 0 381.2,148.0 V154.0 A4,4 0 0 0 385.2,158.0 H527.0 Z" class="amoris"/>
<text x="375.2" y="155.5" class="t1" font-size="12" text-anchor="end">0.42×</text>
<text x="24.0" y="184.0" class="t1" font-size="13" text-anchor="start">10,000 ray casts</text>
<text x="24.0" y="198.0" class="t3" font-size="11" text-anchor="start">the rays' time, not the step's</text>
<path d="M527.0,178.0 H547.9 A4,4 0 0 1 551.9,182.0 V188.0 A4,4 0 0 1 547.9,192.0 H527.0 Z" class="other"/>
<text x="557.9" y="189.5" class="t1" font-size="12" text-anchor="start">1.16×</text>
<text x="24.0" y="218.0" class="t1" font-size="13" text-anchor="start">Convex bodies on a mesh terrain</text>
<path d="M527.0,212.0 H604.1 A4,4 0 0 1 608.1,216.0 V222.0 A4,4 0 0 1 604.1,226.0 H527.0 Z" class="other"/>
<text x="614.1" y="223.5" class="t1" font-size="12" text-anchor="start">1.62×</text>
<text x="24.0" y="252.0" class="t1" font-size="13" text-anchor="start">Ragdolls, no sleeping</text>
<text x="24.0" y="266.0" class="t3" font-size="11" text-anchor="start">160 motor-driven ragdolls</text>
<path d="M527.0,246.0 H672.9 A4,4 0 0 1 676.9,250.0 V256.0 A4,4 0 0 1 672.9,260.0 H527.0 Z" class="other"/>
<text x="682.9" y="257.5" class="t1" font-size="12" text-anchor="start">2.44×</text>
<line x1="527.0" y1="106.0" x2="527.0" y2="268.0" class="base" stroke-width="1.5"/>
<text x="24.0" y="311.0" class="t3" font-size="11.5" text-anchor="start">Apple M5 · native, single thread · 2026-10-04 · 5 to 8 interleaved repetitions on a shared machine;</text>
<text x="24.0" y="328.0" class="t3" font-size="11.5" text-anchor="start">ratios paired within each repetition. Deterministic builds of both gave the same bits natively and in WebAssembly.</text>
</svg>
